name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Smoke test the CLI
        run: |
          go build -o klta ./cmd/k8s-ingress-tls-audit
          # examples contain intentional misconfig, so a non-zero exit is expected
          set +e
          ./klta --dir examples/manifests --days 30 --now 2026-09-15T00:00:00Z > audit.txt
          code=$?
          set -e
          cat audit.txt
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from example audit, got $code"
            exit 1
          fi
          grep -Eq '^expiring +prod +promo .* soon-tls ' audit.txt
