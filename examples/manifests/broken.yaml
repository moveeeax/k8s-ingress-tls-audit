apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: prod
spec:
  rules:
    - host: api.example.com # covered by tls below
    - host: legacy.example.com # NOT in any tls entry -> MISSING_TLS
  tls:
    - hosts:
        - api.example.com
      secretName: api-tls # secret does not exist -> MISSING_SECRET
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: prod
spec:
  rules:
    - host: admin.example.com
  tls:
    - hosts:
        - admin.example.com
      secretName: admin-tls
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-tls
  namespace: prod
type: Opaque # wrong type -> BAD_SECRET
data:
  tls.crt: Zm9v
  tls.key: YmFy
