apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: promo
  namespace: prod
spec:
  rules:
    - host: soon.example.com
  tls:
    - hosts: [soon.example.com]
      # soon-tls expires 2026-09-24T16:35:54Z: EXPIRING with --now 2026-09-15T00:00:00Z --days 30,
      # EXPIRED when audited at the current time.
      secretName: soon-tls
